name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - main
trigger:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-ashy-island-06d13ba10-variable-group
  steps:
  - checkout: self
    submodules: true
  
  - task : PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'nextgen-frontend/dist'
      ArtifactName: 'drop'


  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_ISLAND_06D13BA10)
      app_location: "/nextgen-frontend" # App source code path
      api_location: "" # Api source code path - optional
      output_location: "dist" # Built app content directory - optional

